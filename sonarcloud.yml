name: SonarCloud

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Download and install EvoSuite runtime jar
        run: |
          wget -O evosuite-1.2.0.jar https://github.com/EvoSuite/evosuite/releases/download/v1.2.0/evosuite-1.2.0.jar
          mvn install:install-file \
            -Dfile=evosuite-1.2.0.jar \
            -DgroupId=org.evosuite \
            -DartifactId=evosuite-standalone-runtime \
            -Dversion=1.2.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd lang/java
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=lucaaa02_avro \
            -Dsonar.organization=lucaaa02 \
            -Dsonar.host.url=https://sonarcloud.io